services:
  ticketing:
    image: ticketing:${IMAGE_TAG:-0.1.0}
    build:
      context: ./ticketing
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the deployment environment}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE in the deployment environment}
      PHX_HOST: ${PHX_HOST:?Set PHX_HOST in the deployment environment}
      PORT: ${PORT:-4000}
      POOL_SIZE: ${POOL_SIZE:-10}
      PHX_SERVER: "true"
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    restart: unless-stopped
