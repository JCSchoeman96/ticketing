name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character SHA of the main commit to validate
        required: true
        type: string

# Temporary TICK-56 branch helper: allows the PR workflow to persist the
# resolver-produced Bandit-only lock update. Removed before final review.
permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          # Ephemeral job-owned credentials. These are not workstation values.
          POSTGRES_USER: ticketing_ci
          POSTGRES_PASSWORD: ticketing_ci
          POSTGRES_DB: ticketing_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketing_ci -d ticketing_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TICKETING_DEV_DB_HOST: 127.0.0.1
      TICKETING_DEV_DB_PORT: 5432
      TICKETING_DEV_DB_USER: ticketing_ci
      TICKETING_DEV_DB_PASSWORD: ticketing_ci
      TICKETING_DEV_DB_NAME: ticketing_dev
      TICKETING_DEV_MIGRATION_DB_USER: ticketing_ci
      TICKETING_DEV_MIGRATION_DB_PASSWORD: ticketing_ci
      TICKETING_DEV_RUNTIME_DB_USER: ticketing_dev_runtime
      TICKETING_TEST_DB_HOST: 127.0.0.1
      TICKETING_TEST_DB_PORT: 5432
      TICKETING_TEST_DB_USER: ticketing_ci
      TICKETING_TEST_DB_PASSWORD: ticketing_ci
      TICKETING_TEST_DB_NAME: ticketing_test
      TICKETING_TEST_MIGRATION_DB_USER: ticketing_ci
      TICKETING_TEST_MIGRATION_DB_PASSWORD: ticketing_ci
      TICKETING_TEST_RUNTIME_DB_USER: ticketing_test_runtime
    steps:
      - name: Verify requested main candidate
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Recovery runs must be dispatched on refs/heads/main."
            exit 1
          fi
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_sha must be a full 40-character commit SHA."
            exit 1
          fi
      - uses: actions/checkout@v7
        if: github.event_name != 'workflow_dispatch'
      - name: Check out requested candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}
      - name: Verify requested candidate checkout
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$CANDIDATE_SHA" ]]; then
            echo "::error::Checked out commit does not match candidate_sha."
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install authority validation dependencies
        run: python -m pip install -r authority/requirements-release.txt
      - uses: erlef/setup-beam@v1
        with:
          version-file: ".tool-versions"
          version-type: "strict"
      - name: Create constrained runtime roles
        shell: bash
        run: |
          dev_runtime_password="$(openssl rand -hex 32)"
          test_runtime_password="$(openssl rand -hex 32)"
          echo "::add-mask::$dev_runtime_password"
          echo "::add-mask::$test_runtime_password"
          {
            echo "TICKETING_DEV_RUNTIME_DB_PASSWORD=$dev_runtime_password"
            echo "TICKETING_TEST_RUNTIME_DB_PASSWORD=$test_runtime_password"
          } >> "$GITHUB_ENV"

          TICKETING_DEV_RUNTIME_DB_PASSWORD="$dev_runtime_password" \
          TICKETING_TEST_RUNTIME_DB_PASSWORD="$test_runtime_password" \
          PGPASSWORD="$TICKETING_DEV_MIGRATION_DB_PASSWORD" \
            psql -h "$TICKETING_DEV_DB_HOST" -p "$TICKETING_DEV_DB_PORT" \
              -U "$TICKETING_DEV_MIGRATION_DB_USER" -d "$TICKETING_DEV_DB_NAME" \
              -v ON_ERROR_STOP=1 <<'SQL'
          \getenv dev_runtime_password TICKETING_DEV_RUNTIME_DB_PASSWORD
          \getenv test_runtime_password TICKETING_TEST_RUNTIME_DB_PASSWORD
          CREATE ROLE ticketing_dev_runtime LOGIN PASSWORD :'dev_runtime_password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          CREATE ROLE ticketing_test_runtime LOGIN PASSWORD :'test_runtime_password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          SQL
      - name: Test Tailwind acquisition failure safety
        run: bash scripts/ci/test-tailwind-acquisition.sh
      - name: Acquire checksum-verified Tailwind binary
        run: bash scripts/ci/ensure-tailwind-binary.sh "$GITHUB_WORKSPACE"
      - name: Install and set up the application
        working-directory: ticketing
        run: mix setup
      - name: Persist resolver-produced Bandit lock
        if: github.event_name == 'pull_request' && github.head_ref == 'impl/tick-56-bandit-security'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- ticketing/mix.lock; then
            echo "mix.lock already matches the manifest resolution; nothing to persist."
            exit 0
          fi

          git diff -- ticketing/mix.lock | tee /tmp/tick56-lock.diff

          lock_numstat="$(git diff --numstat -- ticketing/mix.lock)"
          expected_numstat=$'2\t2\tticketing/mix.lock'
          if [[ "$lock_numstat" != "$expected_numstat" ]]; then
            echo "::error::Expected one Bandit line replacement plus EOF newline normalization; got: $lock_numstat"
            exit 1
          fi

          removed_dep_lines="$(grep -c '^-  "[^"]*": {:hex' /tmp/tick56-lock.diff || true)"
          added_dep_lines="$(grep -c '^+  "[^"]*": {:hex' /tmp/tick56-lock.diff || true)"
          if [[ "$removed_dep_lines" != "1" || "$added_dep_lines" != "1" ]]; then
            echo "::error::Expected exactly one removed and one added dependency entry."
            exit 1
          fi
          if ! grep -Fq -- '-  "bandit": {:hex, :bandit, "1.13.1"' /tmp/tick56-lock.diff; then
            echo "::error::Expected the old Bandit 1.13.1 lock entry to be the only removed dependency."
            exit 1
          fi
          if ! grep -Fq -- '+  "bandit": {:hex, :bandit, "1.14.0"' /tmp/tick56-lock.diff; then
            echo "::error::Expected the approved Bandit 1.14.0 lock entry to be the only added dependency."
            exit 1
          fi
          if ! grep -Fq '\ No newline at end of file' /tmp/tick56-lock.diff; then
            echo "::error::Expected the only additional lock change to be EOF newline normalization."
            exit 1
          fi

          cp ticketing/mix.lock /tmp/tick56-mix.lock
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          cp /tmp/tick56-mix.lock ticketing/mix.lock

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ticketing/mix.lock
          git commit -m "fix: lock Bandit 1.14.0"
          git push origin HEAD:"$GITHUB_HEAD_REF"
      - name: Verify Bandit runtime smoke
        working-directory: ticketing
        run: mix test test/ticketing_web/bandit_runtime_smoke_test.exs
      - name: Run application verification
        working-directory: ticketing
        run: mix check
      - name: Verify partitioned TEST database on PostgreSQL 18
        working-directory: ticketing
        env:
          MIX_TEST_PARTITION: "1"
        run: mix test test/ticketing/repo_smoke_test.exs
      - name: Run TICK-56 handoff verification
        shell: bash
        run: |
          set -euo pipefail
          cd ticketing
          mix deps.get
          mix format --check-formatted
          mix compile --warnings-as-errors
          MIX_ENV=dev mix usage_rules.list
          MIX_ENV=dev mix usage_rules.sync
          cd ..
          git diff --exit-code
          cd ticketing
          MIX_ENV=dev mix usage_rules.sync --check
          mix precommit
          mix contract.authority
          mix ash.codegen --check
          cd ..
          git diff --check

  check_types:
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
      TICKETING_TEST_DB_HOST: 127.0.0.1
      TICKETING_TEST_DB_PORT: "55433"
      TICKETING_TEST_DB_USER: ticketing_typecheck
      TICKETING_TEST_DB_PASSWORD: ticketing_typecheck
      TICKETING_TEST_DB_NAME: ticketing_test
      TICKETING_TEST_MIGRATION_DB_USER: ticketing_typecheck
      TICKETING_TEST_MIGRATION_DB_PASSWORD: ticketing_typecheck
      TICKETING_TEST_RUNTIME_DB_USER: ticketing_test_runtime
      TICKETING_TEST_RUNTIME_DB_PASSWORD: ticketing_typecheck_runtime
    steps:
      - name: Verify requested main candidate
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Recovery runs must be dispatched on refs/heads/main."
            exit 1
          fi
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_sha must be a full 40-character commit SHA."
            exit 1
          fi
      - uses: actions/checkout@v7
        if: github.event_name != 'workflow_dispatch'
      - name: Check out requested candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}
      - name: Verify requested candidate checkout
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$CANDIDATE_SHA" ]]; then
            echo "::error::Checked out commit does not match candidate_sha."
            exit 1
          fi
      - uses: erlef/setup-beam@v1
        with:
          version-file: ".tool-versions"
          version-type: "strict"
      - name: Fetch application dependencies
        working-directory: ticketing
        run: mix deps.get
      - name: Run Dialyzer
        working-directory: ticketing
        run: mix check.types
