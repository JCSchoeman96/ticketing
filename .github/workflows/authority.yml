name: Authority checks

on:
  pull_request:
    paths:
      - "authority/**"
      - "AGENTS.md"
      - ".gitattributes"
      - ".gitignore"
      - ".github/workflows/authority.yml"
  push:
    branches: [main]
    paths:
      - "authority/**"
      - "AGENTS.md"
      - ".gitattributes"
      - ".gitignore"
      - ".github/workflows/authority.yml"
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character SHA of the main commit to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify requested main candidate
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Recovery runs must be dispatched on refs/heads/main."
            exit 1
          fi
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_sha must be a full 40-character commit SHA."
            exit 1
          fi
      - name: Check out repository
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check out requested candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - name: Verify requested candidate checkout
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$CANDIDATE_SHA" ]]; then
            echo "::error::Checked out commit does not match candidate_sha."
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install authority validation dependencies
        run: python -m pip install -r authority/requirements-release.txt pytest==9.1.1
      - name: Run authority tests
        working-directory: authority
        run: python -m pytest -q
      - name: Verify active contract inventory and ZIP parity
        working-directory: authority
        run: python tools/contract_manifest.py verify --root .
      - name: Verify CANON pins against active ZIPs
        working-directory: authority
        run: python tools/generate_canon.py verify --root .
      - name: Run strict canonical audit
        working-directory: authority
        run: >-
          python tools/reconcile_contracts.py audit --canonical --strict
          --root .
          --json-output /tmp/contract-reconciliation-strict.json
          --markdown-output /tmp/contract-reconciliation-strict.md
